name: Firebase — известувања и правила

# Ја качува функцијата за известувања од пријателите (functions/) и правилата (firestore.rules).
# Пред прв пат: Firebase Blaze, APNs клуч во Firebase → Cloud Messaging,
# и тајната FIREBASE_SERVICE_ACCOUNT во GitHub (Settings → Secrets and variables → Actions).

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Што да се качи"
        type: choice
        options:
          - функција и правила
          - само функцијата
          - само правилата
        default: функција и правила

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: valise-76aa0
    steps:
      - name: Провери ја тајната
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Нема тајна FIREBASE_SERVICE_ACCOUNT. Додај ја во Settings → Secrets and variables → Actions."
            echo "## Фали тајната FIREBASE_SERVICE_ACCOUNT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Пакети и проверка на функцијата
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Најава во Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Качување
        run: |
          set -o pipefail
          case "${{ inputs.what }}" in
            "само функцијата") ONLY="functions" ;;
            "само правилата") ONLY="firestore:rules" ;;
            *) ONLY="functions,firestore:rules" ;;
          esac
          echo "▶︎ firebase deploy --only $ONLY"
          npx --yes firebase-tools@14 deploy --only "$ONLY" --project "$PROJECT_ID" --non-interactive --force 2>&1 | tee deploy.log
          {
            echo "## Качено на Firebase ✓"
            echo "Што: $ONLY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Прикажи ги грешките
        if: failure()
        run: |
          {
            echo "## Грешки"
            echo '```'
            grep -iE "error|denied|permission|billing|blaze" deploy.log 2>/dev/null | sort -u | head -40
            echo '```'
            echo "Ако пишува за дозволи (permission) при прво качување — почекај 5 минути и пушти повторно."
          } >> "$GITHUB_STEP_SUMMARY"
