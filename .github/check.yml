name: Провери ја апликацијата

# Без Mac и без телефон: на Mac машина од GitHub
#  1. ја гради апликацијата за симулатор (Debug) — дали кодот воопшто се гради;
#  2. ја пушта самопроверката на логиката (Sources/SelfTest.swift): листа, прогноза, авиокомпании,
#     аутфити, планови на пријателите, синхронизација, преводи;
#  3. ја отвора апликацијата на сите 13 јазици и ги слика главните екрани (iPhone 17 Pro и мал iPhone SE),
#     и ги собира текстовите што немаат превод;
#  4. ја гради Release верзијата (иста како за TestFlight, без потпис);
#  5. ја проверува функцијата за push-известувања.
# Резултат: Summary (горе на страницата) и Artifacts → Tripdrobe-check.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Преземи код
        uses: actions/checkout@v4

      - name: Инсталирај XcodeGen
        run: brew install xcodegen

      - name: Направи Xcode проект
        run: xcodegen generate

      - name: Демо-гардероба
        run: |
          if [ ! -f Screenshots/wardrobe/manifest.json ] && [ -f demo-wardrobe.zip ]; then
            mkdir -p Screenshots/wardrobe
            unzip -o -j demo-wardrobe.zip -d Screenshots/wardrobe
          fi
          [ -f Screenshots/wardrobe/manifest.json ] && echo "✓ Демо-гардероба" || echo "⚠︎ Нема демо-гардероба"

      - name: Изгради за симулатор (Debug)
        id: debug
        run: |
          set -o pipefail
          for XCODE in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -Vr | head -2); do
            sudo xcode-select -s "$XCODE/Contents/Developer"
            echo "▶︎ Градам со $XCODE"
            xcodebuild -version
            rm -rf build
            if xcodebuild \
                -project Valise.xcodeproj \
                -scheme Valise \
                -configuration Debug \
                -sdk iphonesimulator \
                -destination 'generic/platform=iOS Simulator' \
                -derivedDataPath build \
                -skipPackagePluginValidation \
                -skipMacroValidation \
                CODE_SIGNING_ALLOWED=NO \
                build 2>&1 | tee build.log; then
              APP=$(find build/Build/Products -maxdepth 2 -name "Valise.app" -path "*iphonesimulator*" | head -1)
              echo "APP_PATH=$APP" >> "$GITHUB_ENV"
              echo "XCODE_APP=$XCODE" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "✗ Не успеа со $XCODE"
          done
          exit 1

      - name: Подготви симулатори
        run: |
          xcrun simctl list -j > sim.json
          python3 - <<'EOF'
          import json, subprocess

          data = json.load(open("sim.json"))
          runtimes = [r for r in data["runtimes"]
                      if r.get("isAvailable") and r.get("platform", r.get("name", "")).startswith("iOS")]
          if not runtimes:
              raise SystemExit("Нема iOS симулатор на овој Mac")
          runtime = sorted(runtimes, key=lambda r: [int(x) for x in r["version"].split(".")])[-1]
          supported = {t["identifier"] for t in runtime.get("supportedDeviceTypes", [])}
          types = [t for t in data["devicetypes"] if not supported or t["identifier"] in supported]
          print("Runtime:", runtime["name"])

          def pick(*names):
              for name in names:
                  for t in types:
                      if t["name"] == name:
                          return t
              return None

          wanted = {
              "pro": pick("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"),
              "small": pick("iPhone SE (3rd generation)", "iPhone 16e", "iPhone 13 mini", "iPhone 12 mini"),
          }
          lines = []
          for key, devtype in wanted.items():
              if not devtype:
                  print(f"– {key}: нема")
                  continue
              udid = subprocess.check_output(
                  ["xcrun", "simctl", "create", f"Check {key}", devtype["identifier"], runtime["identifier"]],
                  text=True).strip()
              print(f"✓ {key}: {devtype['name']} → {udid}")
              lines.append(f"{key} {udid}")
          open("devices.txt", "w").write("\n".join(lines) + "\n")
          EOF
          cat devices.txt

      - name: Самопроверка на логиката
        run: |
          BUNDLE=com.valise.packing
          mkdir -p out report/crashes
          read -r KEY UDID < devices.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$APP_PATH"
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          rm -f "$DATA/Documents/selftest.json"
          xcrun simctl launch --stdout="$PWD/out/selftest-stdout.txt" --stderr="$PWD/out/selftest-stderr.txt" \
            "$UDID" "$BUNDLE" -TripdrobeScreenshots -TripdrobeSelfTest -screen home > /dev/null || true
          for i in $(seq 1 120); do
            [ -f "$DATA/Documents/selftest.json" ] && break
            sleep 2
          done
          sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          if [ -f "$DATA/Documents/selftest.json" ]; then
            cp "$DATA/Documents/selftest.json" out/selftest.json
            python3 -c "import json; r=json.load(open('out/selftest.json')); print('\n'.join(('✓ ' if x['passed'] else '✗ ') + x['name'] + ('' if x['passed'] else ' — ' + x['detail']) for x in r))"
          else
            echo "✗ Нема резултат — апликацијата падна или не се отвори"
          fi
          # Падови (ако ги има)
          find ~/Library/Logs/DiagnosticReports -name "Valise*" -newer devices.txt -exec cp {} report/crashes/ \; 2>/dev/null || true

      - name: Сите јазици на главните екрани
        run: |
          BUNDLE=com.valise.packing
          LANGS="en mk sq sr bg el tr de fr es it pl pt"
          mkdir -p shots out/missing
          while read -r KEY UDID <&3; do
            [ -z "$UDID" ] && continue
            case "$KEY" in
              pro) SCREENS="language name home trip friends weather packing exit outfits wardrobe looks settings new dates edit-bags offer" ;;
              *) SCREENS="language name home trip settings new" ;;
            esac
            echo "▶︎ $KEY ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100 || true
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl install "$UDID" "$APP_PATH"
            DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            if [ -f Screenshots/wardrobe/manifest.json ]; then
              mkdir -p "$DATA/Documents/demo-wardrobe"
              cp -R Screenshots/wardrobe/. "$DATA/Documents/demo-wardrobe/"
            fi

            # Загревање: фотографиите од дестинациите се симнуваат еднаш
            xcrun simctl launch "$UDID" "$BUNDLE" -TripdrobeScreenshots -screen home > /dev/null || true
            sleep 30
            xcrun simctl terminate "$UDID" "$BUNDLE" || true

            for LANG in $LANGS; do
              mkdir -p "shots/$KEY/$LANG"
              for SCREEN in $SCREENS; do
                xcrun simctl launch "$UDID" "$BUNDLE" -TripdrobeScreenshots -lang "$LANG" -screen "$SCREEN" > /dev/null || true
                case "$SCREEN" in
                  home|trip|friends|weather|packing|exit|outfits|dates|edit-bags) sleep 8 ;;
                  *) sleep 6 ;;
                esac
                xcrun simctl io "$UDID" screenshot "shots/$KEY/$LANG/$SCREEN.png" > /dev/null || echo "  ✗ $LANG $SCREEN"
                xcrun simctl terminate "$UDID" "$BUNDLE" || true
              done
              echo "  ✓ $LANG"
            done

            for FILE in "$DATA"/Documents/missing-translations-*.txt; do
              [ -f "$FILE" ] && cp "$FILE" "out/missing/$KEY-$(basename "$FILE")"
            done
            xcrun simctl shutdown "$UDID" || true
          done 3< devices.txt
          find ~/Library/Logs/DiagnosticReports -name "Valise*" -newer devices.txt -exec cp {} report/crashes/ \; 2>/dev/null || true

      - name: Прегледни листови
        run: |
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow || true
          python3 .github/scripts/check-report.py sheets

      - name: Изгради Release (како за TestFlight)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild \
            -project Valise.xcodeproj \
            -scheme Valise \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            VALISE_STORE_BUILD=YES \
            build 2>&1 | tee release.log

      - name: Push-известувања (functions)
        id: functions
        continue-on-error: true
        working-directory: functions
        run: node test.js

      - name: Извештај
        if: always()
        env:
          DEBUG_OUTCOME: ${{ steps.debug.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          FUNCTIONS_OUTCOME: ${{ steps.functions.outcome }}
        run: |
          python3 .github/scripts/check-report.py summary >> "$GITHUB_STEP_SUMMARY"
          mkdir -p report
          cp -R out report/ 2>/dev/null || true
          [ -f build.log ] && grep -E "error:|warning: .*deprecated" build.log | sort -u | head -200 > report/build-errors.txt || true
          [ -f release.log ] && grep -E "error:" release.log | sort -u | head -200 > report/release-errors.txt || true
          [ -d shots ] && cp -R shots report/ || true

      - name: Качи го извештајот
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tripdrobe-check
          path: report
          retention-days: 30

      - name: Конечен резултат
        if: always()
        run: |
          STATUS=$(cat report/status.txt 2>/dev/null || echo "fail: нема извештај")
          echo "$STATUS"
          case "$STATUS" in ok*) exit 0 ;; *) exit 1 ;; esac
