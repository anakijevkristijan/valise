name: Качи на TestFlight

# Рачно: Actions → „Качи на TestFlight“ → Run workflow.
# Потребни Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   – Team ID од developer.apple.com → Account → Membership details
#   ASC_KEY_ID      – Key ID на App Store Connect API клучот (улога Admin)
#   ASC_ISSUER_ID   – Issuer ID од истата страница
#   ASC_KEY_P8      – целата содржина на датотеката AuthKey_XXXX.p8
#
# Како работи (без Mac и без рачни сертификати):
# 1) архива без потпис  2) локален потпис со entitlements (Најава со Apple, WeatherKit)
# 3) извоз со API клучот — Apple сам потпишува со сертификат што го чува во облак и го качува на App Store Connect.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac кај GitHub (ако долго чека „waiting for a hosted runner“, откажи и пробај друг)"
        type: choice
        options:
          - macos-26
          - macos-latest
          - macos-15
        default: macos-26

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Преземи код
        uses: actions/checkout@v4

      - name: Провери ги Secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "## Недостасуваат Secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Недостасуваат Secrets:$missing"
            exit 1
          fi

      - name: Најди го проектот
        run: |
          DIR=$(dirname "$(find . -name project.yml -not -path './.git/*' | head -1)")
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/Valise.xcarchive" >> "$GITHUB_ENV"

      - name: API клуч
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Посреднички сертификати на Apple
        run: |
          for CER in AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL -o "$RUNNER_TEMP/$CER.cer" "https://www.apple.com/certificateauthority/$CER.cer" \
              && security import "$RUNNER_TEMP/$CER.cer" -k ~/Library/Keychains/login.keychain-db >/dev/null 2>&1 || true
          done

      - name: Инсталирај XcodeGen
        run: brew install xcodegen

      - name: Направи Xcode проект
        working-directory: ${{ env.APP_DIR }}
        run: xcodegen generate

      - name: Архива (најнов Xcode, ако не успее — претходниот)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          # App Store бара Xcode 26 или понов — постарите ги прескокнуваме
          CANDIDATES=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -Vr \
            | while read -r X; do V=$(basename "$X" .app | sed 's/Xcode_//'); [ "${V%%.*}" -ge 26 ] 2>/dev/null && echo "$X"; done | head -2)
          if [ -z "$CANDIDATES" ]; then
            echo "::error::На овој Mac нема Xcode 26 или понов. Пушти повторно и избери macos-26."
            echo "## На овој Mac нема Xcode 26 — пушти повторно со macos-26" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for XCODE in $CANDIDATES; do
            sudo xcode-select -s "$XCODE/Contents/Developer"
            echo "▶︎ Архивирам со $XCODE"
            rm -rf "$ARCHIVE"
            if xcodebuild archive \
                -project Valise.xcodeproj \
                -scheme Valise \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath "$ARCHIVE" \
                -skipPackagePluginValidation \
                -skipMacroValidation \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                DEVELOPMENT_TEAM="$TEAM_ID" \
                VALISE_STORE_BUILD=YES \
                CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee build.log; then
              echo "XCODE_USED=$XCODE" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "✗ Не успеа со $XCODE"
          done
          exit 1

      - name: Потпис со entitlements
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          APP="$ARCHIVE/Products/Applications/Valise.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          ENT="$RUNNER_TEMP/Valise.entitlements"
          cp Resources/Valise.entitlements "$ENT"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string ${TEAM_ID}.${BUNDLE_ID}" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" "$ENT"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          fi
          codesign --force --sign - --timestamp=none --entitlements "$ENT" "$APP"
          echo "Entitlements:"
          codesign -d --entitlements - "$APP" || true

      - name: Извоз и качување на App Store Connect
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          sudo xcode-select -s "$XCODE_USED/Contents/Developer"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          {
            echo "## Качено на TestFlight ✓"
            echo "Верзија: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVE/Products/Applications/Valise.app/Info.plist") · изградба $BUILD_NUMBER"
            echo ""
            echo "За 10–30 минути изградбата се појавува во App Store Connect → TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Прикажи ги грешките
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: |
          {
            echo "## Грешки"
            echo '```'
            cat build.log export.log 2>/dev/null | grep -E "error|Error|ERROR" | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Избриши го клучот
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
