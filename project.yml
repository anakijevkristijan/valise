# XcodeGen: од ова GitHub сам прави Xcode проект при секоја изградба.
name: Valise

options:
  bundleIdPrefix: com.valise
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  # 12.19.3+ — безбедносна поправка за Firestore (компромитирани eMudhra сертификати, октомври 2026)
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.3
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 10.0.0

targets:
  Valise:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/GoogleService-Info.plist
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_NAME: Valise
        PRODUCT_BUNDLE_IDENTIFIER: com.valise.packing
        MARKETING_VERSION: "2.6"
        CURRENT_PROJECT_VERSION: "18"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Tripdrobe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Сите насоки се дозволени, а AppDelegate ги ограничува на исправено кај обичните iPhone (на отворен iPhone Duo — сите)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSContactsUsageDescription: "Tripdrobe uses the contact you pick to invite a travel companion."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Tripdrobe saves your travel story image to Photos."
        INFOPLIST_KEY_NSCameraUsageDescription: "Tripdrobe uses the camera to photograph clothes for your wardrobe."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # NO = тест-верзија за Sideloadly (Open-Meteo, без Најава со Apple); TestFlight/App Store изградбата праќа YES
        VALISE_STORE_BUILD: "NO"
        # Entitlements (Најава со Apple, WeatherKit) ги потпишува .github/workflows/testflight.yml од Resources/Valise.entitlements
    scheme: {}
