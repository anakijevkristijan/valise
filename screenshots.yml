name: Слики за App Store

# Ја пушта вистинската апликација (Debug) во iPhone и iPad симулатор со демо-патувања
# и ги слика екраните. Резултатот е во Artifacts → Tripdrobe-screenshots.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Преземи код
        uses: actions/checkout@v4

      - name: Инсталирај XcodeGen
        run: brew install xcodegen

      - name: Направи Xcode проект
        run: xcodegen generate

      - name: Изгради за симулатор (Debug)
        run: |
          set -o pipefail
          for XCODE in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -Vr | head -2); do
            sudo xcode-select -s "$XCODE/Contents/Developer"
            echo "▶︎ Градам со $XCODE"
            xcodebuild -version
            rm -rf build
            if xcodebuild \
                -project Valise.xcodeproj \
                -scheme Valise \
                -configuration Debug \
                -sdk iphonesimulator \
                -destination 'generic/platform=iOS Simulator' \
                -derivedDataPath build \
                -skipPackagePluginValidation \
                -skipMacroValidation \
                CODE_SIGNING_ALLOWED=NO \
                build 2>&1 | tee build.log; then
              APP=$(find build/Build/Products -maxdepth 2 -name "Valise.app" -path "*iphonesimulator*" | head -1)
              echo "APP_PATH=$APP" >> "$GITHUB_ENV"
              echo "Апликацијата: $APP"
              exit 0
            fi
            echo "✗ Не успеа со $XCODE"
          done
          exit 1

      - name: Подготви симулатори
        run: |
          xcrun simctl list -j > sim.json
          python3 - <<'EOF'
          import json, subprocess, os

          data = json.load(open("sim.json"))
          runtimes = [r for r in data["runtimes"]
                      if r.get("isAvailable") and r.get("platform", r.get("name", "")).startswith("iOS")]
          if not runtimes:
              raise SystemExit("Нема iOS симулатор на овој Mac")
          runtime = sorted(runtimes, key=lambda r: [int(x) for x in r["version"].split(".")])[-1]
          supported = {t["identifier"] for t in runtime.get("supportedDeviceTypes", [])}
          types = [t for t in data["devicetypes"] if not supported or t["identifier"] in supported]
          print("Runtime:", runtime["name"])

          def pick(*names, contains=None):
              for name in names:
                  for t in types:
                      if t["name"] == name:
                          return t
              if contains:
                  matches = [t for t in types if contains in t["name"]]
                  if matches:
                      return sorted(matches, key=lambda t: t["name"])[-1]
              return None

          wanted = {
              "iphone": pick("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"),
              "iphone-max": pick("iPhone 17 Pro Max", "iPhone 16 Pro Max", "iPhone 15 Pro Max"),
              "ipad": pick("iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)",
                           "iPad Pro (12.9-inch) (6th generation)", contains="iPad Pro 13"),
              "duo": pick(contains="Duo"),
          }
          lines = []
          for key, devtype in wanted.items():
              if not devtype:
                  print(f"– {key}: нема")
                  continue
              try:
                  udid = subprocess.check_output(
                      ["xcrun", "simctl", "create", f"Shot {key}", devtype["identifier"], runtime["identifier"]],
                      text=True).strip()
              except subprocess.CalledProcessError as error:
                  print(f"✗ {key}: {devtype['name']} не може да се направи ({error})")
                  continue
              print(f"✓ {key}: {devtype['name']} → {udid}")
              lines.append(f"{key} {udid}")
          open("devices.txt", "w").write("\n".join(lines) + "\n")
          EOF
          cat devices.txt

      - name: Сликај ги екраните
        run: |
          BUNDLE=com.valise.packing
          SCREENS="home trip weather outfits day bags packing story wardrobe looks"
          mkdir -p shots
          while read -r KEY UDID <&3; do
            [ -z "$UDID" ] && continue
            echo "▶︎ $KEY ($UDID)"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100 || true
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl install "$UDID" "$APP_PATH"

            # Демо-гардероба (слики + manifest.json) во Documents на апликацијата
            if [ -f Screenshots/wardrobe/manifest.json ]; then
              DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
              mkdir -p "$DATA/Documents/demo-wardrobe"
              cp -R Screenshots/wardrobe/. "$DATA/Documents/demo-wardrobe/"
            fi

            # Прво загревање: фотографиите од дестинациите се симнуваат и се чуваат
            xcrun simctl launch "$UDID" "$BUNDLE" -TripdrobeScreenshots -screen home > /dev/null
            sleep 45
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl launch "$UDID" "$BUNDLE" -TripdrobeScreenshots -screen story > /dev/null
            sleep 30
            xcrun simctl terminate "$UDID" "$BUNDLE" || true

            mkdir -p "shots/$KEY"
            for SCREEN in $SCREENS; do
              xcrun simctl launch "$UDID" "$BUNDLE" -TripdrobeScreenshots -screen "$SCREEN" > /dev/null
              case "$SCREEN" in
                story) sleep 20 ;;
                home) sleep 15 ;;
                *) sleep 10 ;;
              esac
              xcrun simctl io "$UDID" screenshot "shots/$KEY/$SCREEN.png" > /dev/null
              echo "  ✓ $SCREEN"
              xcrun simctl terminate "$UDID" "$BUNDLE" || true
              sleep 1
            done

            # Истото со друга тема (за разновидност)
            xcrun simctl launch "$UDID" "$BUNDLE" -TripdrobeScreenshots -screen home -theme rose > /dev/null
            sleep 15
            xcrun simctl io "$UDID" screenshot "shots/$KEY/home-rose.png" > /dev/null
            xcrun simctl terminate "$UDID" "$BUNDLE" || true

            xcrun simctl shutdown "$UDID" || true
          done 3< devices.txt

      - name: Качи ги сликите
        uses: actions/upload-artifact@v4
        with:
          name: Tripdrobe-screenshots
          path: shots
          retention-days: 30

      - name: Преглед
        if: always()
        run: |
          {
            echo "## Слики"
            if [ -d shots ]; then
              for f in $(find shots -name "*.png" | sort); do
                echo "- $f ($(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}'))"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Прикажи ги грешките
        if: failure()
        run: |
          {
            echo "## Грешки при изградба"
            echo '```'
            [ -f build.log ] && grep -E "error:" build.log | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
